<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetenvoieca — Bureau</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#FAF7F2;--ivory:#F3EDE3;--noir:#1A1714;--muted:#7A7066;--gold:#C4A028;--pink:#E8698A;--border:rgba(26,23,20,0.12)}
body{font-family:'Jost',sans-serif;background:#EDECE8;color:var(--noir);font-size:14px;font-weight:300;height:100vh;overflow:hidden}
button,input,textarea,select{font-family:'Jost',sans-serif;font-size:13px;font-weight:300}

/* THREE COLUMN LAYOUT */
.shell{display:grid;grid-template-columns:1fr 500px 220px;gap:10px;padding:10px;height:100vh;overflow:hidden}

/* LEFT — live preview */
.preview-pane{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;flex-direction:column}
.preview-bar{height:36px;background:var(--noir);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;border-radius:8px 8px 0 0}
.preview-dot{width:10px;height:10px;border-radius:50%}
.preview-url{font-size:11px;color:rgba(255,255,255,.45);flex:1;text-align:center;letter-spacing:.04em}
.preview-refresh{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-size:15px;padding:4px}
.preview-refresh:hover{color:white}
.preview-pane iframe{flex:1;width:100%;border:none;display:block}

/* MIDDLE — edit form */
.edit-pane{background:white;border-radius:8px;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.edit-inner{padding:28px 28px 48px}
.edit-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);padding:40px}
.edit-empty-logo{font-family:'Cormorant Garamond',serif;font-size:52px;font-style:italic;color:var(--gold);margin-bottom:14px;letter-spacing:.04em}
.edit-empty p{font-size:13px;line-height:1.8;max-width:240px}
.edit-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;margin-bottom:4px}
.edit-sub{font-size:12px;color:var(--muted);margin-bottom:22px;letter-spacing:.02em}
.sticky-hd{position:sticky;top:0;z-index:5;background:white;margin:-28px -28px 20px;padding:20px 28px 14px;border-bottom:1px solid var(--border)}

/* RIGHT — nav */
.nav-pane{background:#231F1B;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.nav-inner{flex:1;overflow-y:auto;padding:12px}

/* Publish */
.action-row{margin-bottom:12px}
.btn-publish{width:100%;padding:10px;background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:5px;transition:all .2s;font-family:'Jost',sans-serif;font-weight:500}
.btn-publish:hover{border-color:var(--gold);color:var(--gold)}
.btn-publish.pending{background:var(--gold);color:white;border-color:var(--gold);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,160,40,.5)}50%{box-shadow:0 0 0 6px rgba(196,160,40,0)}}
.publish-status{font-size:10px;color:rgba(255,255,255,.35);text-align:center;margin:5px 0 12px;letter-spacing:.04em;min-height:14px}
.publish-status.pending{color:#e8c06a}

/* Accordion */
.acc-group{margin-bottom:3px}
.acc-hd{width:100%;padding:9px 12px;border:none;border-radius:5px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .2s,color .2s;background:transparent;color:rgba(255,255,255,.45)}
.acc-hd:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
.acc-hd.open{background:rgba(255,255,255,.07);color:#fff}
.acc-hd .chev{font-size:9px;transition:transform .25s;opacity:.5}
.acc-hd.open .chev{transform:rotate(180deg);opacity:1}
.acc-body{overflow:hidden;max-height:0;transition:max-height .3s ease}
.acc-body.open{max-height:600px}
.acc-items{padding:3px 0 6px 3px}
.acc-item{width:100%;padding:8px 12px;border:none;background:transparent;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:rgba(255,255,255,.65);text-align:left;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;margin-bottom:1px}
.acc-item:hover{background:rgba(255,255,255,.06);color:#fff}
.acc-item.active{background:var(--gold);color:white;font-weight:400}
.nav-divider{height:.5px;background:rgba(255,255,255,.08);margin:8px 3px}
.nav-wordmark{padding:14px 14px 8px;font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:rgba(255,255,255,.25);letter-spacing:.08em}

/* Form elements */
.card{background:var(--ivory);border-radius:6px;padding:16px;margin-bottom:14px}
.card-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:.5px solid var(--border);background:white;color:var(--noir);outline:none;border-radius:4px;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;line-height:1.7;min-height:90px}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Image upload */
.img-upload{border:1px dashed var(--border);border-radius:4px;background:var(--ivory);padding:14px;text-align:center;cursor:pointer;transition:border-color .2s}
.img-upload:hover{border-color:var(--gold)}
.img-upload p{font-size:12px;color:var(--muted);margin-top:6px}
.img-upload img{max-height:120px;max-width:100%;border-radius:3px;display:block;margin:0 auto}

/* Back link */
.back-link{background:none;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px}
.back-link:hover{color:var(--noir)}

/* Form actions */
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-save{padding:9px 22px;background:var(--noir);color:white;border:none;border-radius:4px;font-size:12px;letter-spacing:.06em;cursor:pointer}
.btn-save:hover{background:var(--gold)}
.btn-cancel{padding:9px 16px;border:.5px solid var(--border);background:transparent;border-radius:4px;font-size:12px;color:var(--muted);cursor:pointer}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;background:var(--noir);color:white;font-size:13px;border-radius:6px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.success{background:#2e7d32}
.toast.error{background:#c0392b}
</style>
</head>
<body>

<div class="shell">

  <!-- LEFT: Preview -->
  <div class="preview-pane">
    <div class="preview-bar">
      <div class="preview-dot" style="background:#ff5f57"></div>
      <div class="preview-dot" style="background:#febc2e"></div>
      <div class="preview-dot" style="background:#28c840"></div>
      <span class="preview-url" id="preview-url">jetenvoieca.com</span>
      <button class="preview-refresh" onclick="refreshPreview()" title="Refresh">Refresh</button>
    </div>
    <iframe id="preview" src="https://jetenvoieca.com" title="Site preview"></iframe>
    <div id="preview-image-wrap" style="display:none;flex:1;align-items:center;justify-content:center;padding:60px;overflow:auto;background:var(--cream)">
      <img id="preview-image" style="display:none;max-width:70%;max-height:70%;object-fit:contain;border-radius:6px;box-shadow:0 10px 34px rgba(0,0,0,.14)">
      <div id="preview-image-fallback" style="display:none;flex-direction:column;align-items:center;gap:14px">
        <img id="preview-image-favicon" style="width:56px;height:56px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.12)">
        <p id="preview-image-domain" style="font-size:13px;color:var(--muted);letter-spacing:.02em"></p>
      </div>
    </div>
  </div>

  <!-- MIDDLE: Edit -->
  <div class="edit-pane" id="edit-pane">
    <div class="edit-empty">
      <div class="edit-empty-logo">Jv</div>
      <p>Select a section from the menu to start editing</p>
    </div>
  </div>

  <!-- RIGHT: Nav -->
  <div class="nav-pane">
    <div class="nav-inner">
      <div class="nav-wordmark">Jetenvoieca</div>

      <div class="action-row">
        <button class="btn-publish" id="btn-publish" onclick="publish()">Publish</button>
        <div class="publish-status" id="publish-status">All changes published</div>
      </div>

      <div class="nav-divider"></div>

      <!-- PAGES -->
      <div class="acc-group">
        <button class="acc-hd open" id="acc-pages" onclick="toggleAcc('pages')">
          Pages <span class="chev">▼</span>
        </button>
        <div class="acc-body open" id="acc-body-pages">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('home')">Home</button>
            <button class="acc-item" onclick="showView('story')">Story</button>
            <button class="acc-item" onclick="showView('contact')">Contact</button>
            <button class="acc-item" onclick="showView('settings-site')">Site Settings</button>
          </div>
        </div>
      </div>

      <div class="nav-divider"></div>

      <!-- SITES -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-sites" onclick="toggleAcc('sites')">
          Sites <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-sites">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('sites-dashboard')">All Sites</button>
          </div>
        </div>
      </div>

      <!-- DOMAINS -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-domains" onclick="toggleAcc('domains')">
          Domains <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-domains">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('domains-unassigned')">Unassigned</button>
            <button class="acc-item" onclick="showView('domains-all')">All Domains</button>
            <button class="acc-item" onclick="showView('domains-sync')">NC Sync</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var state = {
  hasUnsaved: false,
  currentView: null,
  content: loadContent()
};

function loadContent() {
  try { return JSON.parse(localStorage.getItem('jv_content') || '{}'); } catch(e) { return {}; }
}

function saveContent() {
  try { localStorage.setItem('jv_content', JSON.stringify(state.content)); } catch(e) {}
}

function markUnsaved() {
  state.hasUnsaved = true;
  var btn = document.getElementById('btn-publish');
  var status = document.getElementById('publish-status');
  btn.classList.add('pending');
  status.textContent = 'Unsaved changes';
  status.className = 'publish-status pending';
}

function markSaved() {
  state.hasUnsaved = false;
  var btn = document.getElementById('btn-publish');
  var status = document.getElementById('publish-status');
  btn.classList.remove('pending');
  status.textContent = 'All changes saved';
  status.className = 'publish-status';
}

async function publish() {
  saveContent();

  var btn = document.getElementById('btn-publish');
  var status = document.getElementById('publish-status');
  btn.disabled = true;
  status.textContent = 'Publishing…';
  status.className = 'publish-status pending';

  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch (e) {}
  var ncDomains = null;
  try { ncDomains = JSON.parse(localStorage.getItem('nc_domains') || 'null'); } catch (e) {}

  try {
    await publishFile('content', JSON.stringify(state.content, null, 2), 'Update content.json via Bureau');
    await publishFile('sites', JSON.stringify(sites, null, 2), 'Update sites.json via Bureau');
    if (ncDomains) {
      await publishFile('domains', JSON.stringify(ncDomains, null, 2), 'Update domains.json via Bureau');
    }
    markSaved();
    toast('Published to GitHub ✓', 'success');
    setTimeout(refreshPreview, 1500); // give Netlify a moment to rebuild
  } catch (err) {
    status.textContent = 'Publish failed';
    status.className = 'publish-status pending';
    toast('Publish failed: ' + err.message, 'error');
  }
  btn.disabled = false;
}

async function publishFile(target, content, message) {
  var res = await fetch('/.netlify/functions/publish-content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: target, content: content, message: message })
  });
  var json = await res.json();
  if (!res.ok) throw new Error(json.error || ('Publish failed (' + res.status + ')'));
  return json;
}

// ── DEPLOY (via Netlify function — GitHub token lives server-side, never here) ─
// Pulls content.json, sites.json, and domains.json straight off this site
// (public, no auth needed) so Bureau — and the dashboard, since they share
// the same browser storage — always reflect what's actually published,
// rather than whatever was last saved in this one browser.
async function loadFromGitHub(silent) {
  var contentOk = false;
  try {
    var res = await fetch('content.json', { cache: 'no-store' });
    if (res.ok) {
      state.content = await res.json();
      saveContent();
      contentOk = true;
    }
  } catch (err) { /* offline or first deploy — fall through */ }

  try {
    var sitesRes = await fetch('sites.json', { cache: 'no-store' });
    if (sitesRes.ok) {
      var sitesData = await sitesRes.json();
      localStorage.setItem('jv_sites', JSON.stringify(sitesData));
    }
  } catch (err) { /* first publish hasn't happened yet — keep local copy */ }

  try {
    var domainsRes = await fetch('domains.json', { cache: 'no-store' });
    if (domainsRes.ok) {
      var domainsData = await domainsRes.json();
      localStorage.setItem('nc_domains', JSON.stringify(domainsData));
    }
  } catch (err) { /* no domains published yet — keep local copy */ }

  if (state.currentView) showView(state.currentView);
  if (!silent) {
    if (contentOk) toast('Loaded latest published content ✓', 'success');
    else toast('Nothing published yet — hit Publish to create it', 'error');
  }
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ── ACCORDION ────────────────────────────────────────────────────────────────
function toggleAcc(id) {
  var hd = document.getElementById('acc-' + id);
  var body = document.getElementById('acc-body-' + id);
  hd.classList.toggle('open');
  body.classList.toggle('open');
}

// ── PREVIEW ──────────────────────────────────────────────────────────────────
var previewMode = 'site'; // 'site' | 'dashboard'

function refreshPreview() {
  var iframe = document.getElementById('preview');
  iframe.src = iframe.src;
}

function setPreview(mode) {
  var iframe = document.getElementById('preview');
  var wrap = document.getElementById('preview-image-wrap');
  var urlLabel = document.getElementById('preview-url');
  previewMode = mode;

  wrap.style.display = 'none';
  iframe.style.display = '';

  if (mode === 'dashboard') {
    iframe.src = '/dashboard.html';
    urlLabel.textContent = 'jetenvoieca.com/dashboard';
  } else {
    iframe.src = 'https://jetenvoieca.com';
    urlLabel.textContent = 'jetenvoieca.com';
  }
  var btn = document.getElementById('sites-preview-toggle');
  if (btn) btn.textContent = (mode === 'dashboard' ? 'Show Site' : 'Show Dashboard');
}

function toggleDashboard() {
  expandedSiteId = null;
  editingSiteId = null;
  setPreview(previewMode === 'dashboard' ? 'site' : 'dashboard');
  refreshSitesList();
}

// Shows a single site's screenshot in the preview pane, generously spaced —
// no grid, no page chrome, just the image (falls back to favicon + domain
// if no screenshot is available).
function showSiteImage(site) {
  var iframe = document.getElementById('preview');
  var wrap = document.getElementById('preview-image-wrap');
  var img = document.getElementById('preview-image');
  var fallback = document.getElementById('preview-image-fallback');
  var urlLabel = document.getElementById('preview-url');

  iframe.style.display = 'none';
  wrap.style.display = 'flex';
  wrap.style.cursor = 'pointer';
  wrap.onclick = function() { window.open(site.url, '_blank'); };
  urlLabel.textContent = hostnameOf(site.url);

  img.style.display = '';
  fallback.style.display = 'none';
  img.onerror = function() {
    img.style.display = 'none';
    fallback.style.display = 'flex';
    document.getElementById('preview-image-favicon').src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(site.url) + '&sz=64';
    document.getElementById('preview-image-domain').textContent = hostnameOf(site.url);
  };
  img.src = site.image || ('https://s0.wordpress.com/mshots/v1/' + encodeURIComponent(site.url) + '?w=1200&h=800');
  img.alt = site.name;
}

function hostnameOf(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch (e) { return url; }
}

// ── ACTIVE NAV ───────────────────────────────────────────────────────────────
function setActiveNav(view) {
  document.querySelectorAll('.acc-item').forEach(function(b) { b.classList.remove('active'); });
  document.querySelectorAll('.acc-item').forEach(function(b) {
    if (b.getAttribute('onclick') && b.getAttribute('onclick').indexOf("'" + view + "'") > -1) {
      b.classList.add('active');
    }
  });
}

// ── VIEWS ────────────────────────────────────────────────────────────────────
function showView(view) {
  state.currentView = view;
  setActiveNav(view);
  var pane = document.getElementById('edit-pane');

  if (view === 'home') pane.innerHTML = viewHome();
  else if (view === 'story') pane.innerHTML = viewStory();
  else if (view === 'contact') pane.innerHTML = viewContact();
  else if (view === 'sites-dashboard') { pane.innerHTML = viewSites(); setPreview('dashboard'); }
  else if (view === 'domains-all' || view === 'domains-unassigned') pane.innerHTML = viewDomains(view);
  else if (view === 'domains-sync') pane.innerHTML = viewNcSync();
  else if (view === 'settings-site') pane.innerHTML = viewSiteSettings();
  else pane.innerHTML = '<div class="edit-inner"><p style="color:var(--muted);font-size:13px;margin-top:40px;text-align:center">Coming soon</p></div>';

  wireView(view);
}

// ── HOME PAGE EDITOR ─────────────────────────────────────────────────────────
function viewHome() {
  var c = state.content.home || {};
  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">Home Page</div><div class="edit-sub">Public-facing landing page content</div></div>' +

    '<div class="card"><div class="card-title">Three Message Blocks</div>' +

    '<div class="field"><label>Block 1 — Eyebrow</label><input id="h-e1" value="' + esc(c.eyebrow1||'Artists') + '"></div>' +
    '<div class="field"><label>Block 1 — Title</label><input id="h-t1" value="' + esc(c.title1||'Websites for Artists') + '"></div>' +
    '<div class="field"><label>Block 1 — Body</label><textarea id="h-b1">' + esc(c.body1||'Beautiful, minimal portfolio sites. Built to show the work, not obscure it. Every site different. Every artist served.') + '</textarea></div>' +

    '<div class="field"><label>Block 2 — Eyebrow</label><input id="h-e2" value="' + esc(c.eyebrow2||'Commerce') + '"></div>' +
    '<div class="field"><label>Block 2 — Title</label><input id="h-t2" value="' + esc(c.title2||'Serendipity for Online Retail') + '"></div>' +
    '<div class="field"><label>Block 2 — Body</label><textarea id="h-b2">' + esc(c.body2||'Discovery without search. A white-label layer that lets customers browse and find what they didn\'t know they wanted.') + '</textarea></div>' +

    '<div class="field"><label>Block 3 — Eyebrow</label><input id="h-e3" value="' + esc(c.eyebrow3||'Studio') + '"></div>' +
    '<div class="field"><label>Block 3 — Title</label><input id="h-t3" value="' + esc(c.title3||'Design that works differently') + '"></div>' +
    '<div class="field"><label>Block 3 — Body</label><textarea id="h-b3">' + esc(c.body3||'Systems built from the user outward. Unconventional, accessible, effective. Users have loved them. IT departments less so.') + '</textarea></div>' +
    '</div>' +

    '<div class="card"><div class="card-title">Footer</div>' +
    '<div class="field-row">' +
    '<div class="field"><label>Location</label><input id="h-location" value="' + esc(c.location||'Aude · South of France') + '"></div>' +
    '<div class="field"><label>Email</label><input id="h-email" value="' + esc(c.email||'craig@jetenvoieca.com') + '"></div>' +
    '</div></div>' +

    '<div class="form-actions"><button class="btn-save" onclick="saveHome()">Save</button></div>' +
    '</div>';
}

function saveHome() {
  state.content.home = {
    eyebrow1: val('h-e1'), title1: val('h-t1'), body1: val('h-b1'),
    eyebrow2: val('h-e2'), title2: val('h-t2'), body2: val('h-b2'),
    eyebrow3: val('h-e3'), title3: val('h-t3'), body3: val('h-b3'),
    location: val('h-location'), email: val('h-email')
  };
  saveContent(); markUnsaved();
  toast('Home page saved', 'success');
}

// ── STORY PAGE EDITOR ─────────────────────────────────────────────────────────
function viewStory() {
  var c = state.content.story || {};
  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">Story Page</div><div class="edit-sub">Your story and background</div></div>' +

    '<div class="card"><div class="card-title">Headline</div>' +
    '<div class="field"><label>Page Title</label><input id="s-title" value="' + esc(c.title||'Design that happens for a reason') + '"></div>' +
    '<div class="field"><label>Subtitle</label><input id="s-sub" value="' + esc(c.subtitle||'South of France · Since 2020') + '"></div>' +
    '</div>' +

    '<div class="card"><div class="card-title">The Story</div>' +
    '<div class="field"><label>Chapter 1 — The Accident</label><textarea id="s-c1" rows="6">' + esc(c.chapter1||'We were caught on holiday in the South of France by the lockdown — the confinement. During which the house next to the one we were renting came up for sale. So we bought it and stayed. We believe things sort of happen for a reason.') + '</textarea></div>' +

// Matches dashboard.html's resize settings — same fix (never upscale, was
// the main cause of blur) and same higher-quality target.
var IMAGE_MAX_W = 900, IMAGE_MAX_H = 600, IMAGE_QUALITY = 0.85;

function readAndResizeImage(fileInputId) {
  return new Promise(function(resolve) {
    var input = document.getElementById(fileInputId);
    var file = input && input.files && input.files[0];
    if (!file) { resolve(null); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var ratio = Math.min(IMAGE_MAX_W / img.width, IMAGE_MAX_H / img.height, 1); // never upscale
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
      };
      img.onerror = function() { resolve(null); };
      img.src = e.target.result;
    };
    reader.onerror = function() { resolve(null); };
    reader.readAsDataURL(file);
  });
}

async function saveEditSite(id) {
  var name = val('se-name-' + id).trim();
  var url = val('se-url-' + id).trim();
  if (!name || !url) { toast('Name and URL are required', 'error'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  var newImage = await readAndResizeImage('se-image-' + id);

  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch (e) {}
  sites = sites.map(function(s) {
    if (s.id !== id) return s;
    return Object.assign({}, s, {
      name: name,
      email: val('se-email-' + id).trim(),
      url: url,
      sub_method: val('se-method-' + id),
      sub_amount: val('se-amount-' + id).trim(),
      notes: val('se-notes-' + id).trim(),
      verified: document.getElementById('se-verified-' + id).checked,
      image: newImage || s.image
    });
  });
  try {
    localStorage.setItem('jv_sites', JSON.stringify(sites));
  } catch (err) {
    toast('Could not save — local storage is full, try a smaller image', 'error');
    return;
  }
  editingSiteId = null;
  toast('Site updated ✓', 'success');
  refreshSitesList();
  refreshSitesHeader();
  var updated = sites.find(function(s) { return s.id === id; });
  if (updated) showSiteImage(updated);
}

function deleteSiteInline(id) {
  if (!confirm('Remove this site?')) return;
  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch (e) {}
  sites = sites.filter(function(s) { return s.id !== id; });
  localStorage.setItem('jv_sites', JSON.stringify(sites));
  if (expandedSiteId === id) { expandedSiteId = null; setPreview(previewMode); }
  editingSiteId = null;
  toast('Site removed', 'success');
  refreshSitesList();
  refreshSitesHeader();
}

function startAddSite() {
  addingSite = true;
  expandedSiteId = null;
  editingSiteId = null;
  setPreview(previewMode);
  refreshSitesList();
}

function cancelAddSite() {
  addingSite = false;
  refreshSitesList();
}

async function saveNewSite() {
  var name = val('sa-name').trim();
  var url = val('sa-url').trim();
  if (!name || !url) { toast('Name and URL are required', 'error'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

  var image = await readAndResizeImage('sa-image');

  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch (e) {}
  sites.push({
    id: String(Date.now()),
    name: name,
    email: val('sa-email').trim(),
    url: url,
    sub_method: val('sa-method'),
    sub_amount: val('sa-amount').trim(),
    notes: val('sa-notes').trim(),
    verified: document.getElementById('sa-verified').checked,
    domain_owned: false,
    image: image
  });
  try {
    localStorage.setItem('jv_sites', JSON.stringify(sites));
  } catch (err) {
    toast('Could not save — local storage is full, try a smaller image', 'error');
    return;
  }
  addingSite = false;
  toast('Site added ✓', 'success');
  refreshSitesList();
  refreshSitesHeader();
}

function mrr(sites) {
  return sites.reduce(function(sum, s) { return sum + (parseFloat(s.sub_amount) || 0); }, 0);
}

function exportSitesCSV() {
  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch (e) {}
  if (sites.length === 0) { toast('No sites to export', 'error'); return; }

  var headers = ['Name', 'Email', 'URL', 'Payment Method', 'Monthly Amount (£)', 'Domain Owned', 'Verified', 'Notes'];
  var rows = sites.map(function(s) {
    return [
      s.name, s.email || '', s.url, s.sub_method || '', s.sub_amount || '',
      s.domain_owned ? 'Yes' : 'No', s.verified ? 'Yes' : 'No', s.notes || ''
    ].map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; });
  });
  var csv = [headers.map(function(h) { return '"' + h + '"'; })].concat(rows).map(function(r) { return r.join(','); }).join('\r\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jetenvoieca-sites.csv';
  a.click();
  toast('CSV exported ✓', 'success');
}

// ── DOMAINS VIEW ──────────────────────────────────────────────────────────────
function viewDomains(view) {
  var ncData = null;
  try { ncData = JSON.parse(localStorage.getItem('nc_domains') || 'null'); } catch(e) {}
  if (!ncData) {
    return '<div class="edit-inner"><div class="sticky-hd"><div class="edit-title">Domains</div></div>' +
      '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">No domain data yet.<br>Use NC Sync to import your Namecheap domains.</p></div>';
  }

  var sites = [];
  try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch(e) {}

  function hostname(url) {
    try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
  }

  function formatExpiry(d) {
    var dt = new Date(d);
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return dt.getDate() + ' ' + m[dt.getMonth()] + ' ' + dt.getFullYear();
  }

  function expiryColor(d) {
    var days = (new Date(d) - new Date()) / (1000*60*60*24);
    return days < 30 ? '#c0392b' : days < 90 ? '#e67e22' : 'var(--muted)';
  }

  var siteHosts = sites.map(function(s) { return hostname(s.url).toLowerCase(); });
  var all = ncData.domains.slice().sort(function(a,b){ return new Date(a.expiry)-new Date(b.expiry); });
  var unassigned = all.filter(function(d){ return !siteHosts.includes(d.name.toLowerCase()); });
  var list = view === 'domains-unassigned' ? unassigned : all;
  var title = view === 'domains-unassigned' ? 'Unassigned Domains' : 'All Domains';

  var rows = list.map(function(d) {
    var color = expiryColor(d.expiry);
    var assigned = sites.find(function(s){ return hostname(s.url).toLowerCase() === d.name.toLowerCase(); });
    return '<div style="display:flex;align-items:center;padding:9px 0;border-bottom:.5px solid var(--border);gap:10px">' +
      '<a href="http://'+d.name+'" target="_blank" style="flex:1;font-size:13px;color:var(--noir);text-decoration:none">' + d.name + '</a>' +
      (assigned ? '<span style="font-size:11px;color:var(--muted)">' + esc(assigned.name) + '</span>' : '') +
      '<span style="font-size:11px;color:'+color+'">' + formatExpiry(d.expiry) + '</span>' +
      '</div>';
  }).join('');

  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">' + title + '</div>' +
    '<div class="edit-sub">' + list.length + ' domains · fetched ' + new Date(ncData.fetched).toLocaleDateString('en-GB') + '</div></div>' +
    (list.length === 0 ? '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">✓ All domains assigned</p>' : '<div>' + rows + '</div>') +
    '</div>';
}

    '<p style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6">Run <code>node fetch-domains.js</code> in Terminal to generate <code>namecheap-domains.json</code>, then import it here.</p>' +
    '<button class="btn-save" onclick="document.getElementById(\'nc-file\').click()" style="width:100%;text-align:center">Import namecheap-domains.json</button>' +
    '<input type="file" id="nc-file" accept=".json" style="display:none" onchange="importDomains(this)">' +
    '<div id="nc-status" style="font-size:12px;color:var(--muted);margin-top:10px;text-align:center"></div>' +
    '</div></div>';
}

function saveNcCreds() {
  var u = document.getElementById('nc-u').value.trim();
  var k = document.getElementById('nc-k').value.trim();
  var ip = document.getElementById('nc-ip').value.trim();
  if (u) localStorage.setItem('nc_username', u);
  if (k) localStorage.setItem('nc_apikey', k);
  if (ip) localStorage.setItem('nc_ip', ip);
  toast('Credentials saved', 'success');
}

function importDomains(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.domains) throw new Error('Invalid format');
      localStorage.setItem('nc_domains', JSON.stringify(data));

      var sites = [];
      try { sites = JSON.parse(localStorage.getItem('jv_sites') || '[]'); } catch(ex) {}
      function hostname(url) { try { return new URL(url).hostname.replace('www.',''); } catch(ex) { return url; } }
      var matched = 0;
      var siteHosts = sites.map(function(s){ return hostname(s.url).toLowerCase(); });
      var unassigned = data.domains.filter(function(d){ return !siteHosts.includes(d.name.toLowerCase()); });

      sites = sites.map(function(s) {
        var host = hostname(s.url);
        var match = data.domains.find(function(d){ return d.name.toLowerCase() === host.toLowerCase(); });
        if (match) { matched++; return Object.assign({}, s, { nc_expiry: match.expiry, nc_synced: new Date().toISOString(), domain_owned: true }); }
        return Object.assign({}, s, { domain_owned: false });
      });
      localStorage.setItem('jv_sites', JSON.stringify(sites));

      var status = document.getElementById('nc-status');
      if (status) {
        status.style.color = '#2e7d32';
        status.textContent = '✓ ' + matched + ' cards matched · ' + data.domains.length + ' domains · ' + unassigned.length + ' unassigned';
      }
      input.value = '';
      toast('Domains imported ✓', 'success');
    } catch(err) {
      toast('Import failed: ' + err.message, 'error');
      input.value = '';
    }
  };
  reader.readAsText(file);
}

function wireView(view) { /* fields wire via inline oninput/onclick */ }
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.onbeforeunload = function(e) {
  if (state.hasUnsaved) { e.preventDefault(); e.returnValue = ''; return ''; }
};

loadFromGitHub(true);
