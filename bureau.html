<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jetenvoieca — Bureau</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cream:#FAF7F2;--ivory:#F3EDE3;--noir:#1A1714;--muted:#7A7066;--gold:#C4A028;--pink:#E8698A;--border:rgba(26,23,20,0.12)}
body{font-family:'Jost',sans-serif;background:#EDECE8;color:var(--noir);font-size:14px;font-weight:300;height:100vh;overflow:hidden}
button,input,textarea,select{font-family:'Jost',sans-serif;font-size:13px;font-weight:300}

/* THREE COLUMN LAYOUT */
.shell{display:grid;grid-template-columns:1fr 500px 220px;gap:10px;padding:10px;height:100vh;overflow:hidden}

/* LEFT — live preview */
.preview-pane{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;flex-direction:column}
.preview-bar{height:36px;background:var(--noir);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;border-radius:8px 8px 0 0}
.preview-dot{width:10px;height:10px;border-radius:50%}
.preview-url{font-size:11px;color:rgba(255,255,255,.45);flex:1;text-align:center;letter-spacing:.04em}
.preview-refresh{background:none;border:none;color:rgba(255,255,255,.45);cursor:pointer;font-size:15px;padding:4px}
.preview-refresh:hover{color:white}
.preview-pane iframe{flex:1;width:100%;border:none;display:block}

/* MIDDLE — edit form */
.edit-pane{background:white;border-radius:8px;overflow-y:auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.edit-inner{padding:28px 28px 48px}
.edit-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);padding:40px}
.edit-empty-logo{font-family:'Cormorant Garamond',serif;font-size:52px;font-style:italic;color:var(--gold);margin-bottom:14px;letter-spacing:.04em}
.edit-empty p{font-size:13px;line-height:1.8;max-width:240px}
.edit-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;margin-bottom:4px}
.edit-sub{font-size:12px;color:var(--muted);margin-bottom:22px;letter-spacing:.02em}
.sticky-hd{position:sticky;top:0;z-index:5;background:white;margin:-28px -28px 20px;padding:20px 28px 14px;border-bottom:1px solid var(--border)}

/* RIGHT — nav */
.nav-pane{background:#231F1B;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
.nav-inner{flex:1;overflow-y:auto;padding:12px}

/* Publish */
.action-row{margin-bottom:12px}
.btn-publish{width:100%;padding:10px;background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:5px;transition:all .2s;font-family:'Jost',sans-serif;font-weight:500}
.btn-publish:hover{border-color:var(--gold);color:var(--gold)}
.btn-publish.pending{background:var(--gold);color:white;border-color:var(--gold);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,160,40,.5)}50%{box-shadow:0 0 0 6px rgba(196,160,40,0)}}
.publish-status{font-size:10px;color:rgba(255,255,255,.35);text-align:center;margin:5px 0 12px;letter-spacing:.04em;min-height:14px}
.publish-status.pending{color:#e8c06a}

/* Accordion */
.acc-group{margin-bottom:3px}
.acc-hd{width:100%;padding:9px 12px;border:none;border-radius:5px;font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .2s,color .2s;background:transparent;color:rgba(255,255,255,.45)}
.acc-hd:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
.acc-hd.open{background:rgba(255,255,255,.07);color:#fff}
.acc-hd .chev{font-size:7px;transition:transform .25s;opacity:.5}
.acc-hd.open .chev{transform:rotate(180deg);opacity:1}
.acc-body{overflow:hidden;max-height:0;transition:max-height .3s ease}
.acc-body.open{max-height:600px}
.acc-items{padding:3px 0 6px 3px}
.acc-item{width:100%;padding:8px 12px;border:none;background:transparent;font-family:'Jost',sans-serif;font-size:13px;font-weight:300;color:rgba(255,255,255,.65);text-align:left;cursor:pointer;border-radius:5px;display:flex;align-items:center;gap:8px;transition:background .15s,color .15s;margin-bottom:1px}
.acc-item:hover{background:rgba(255,255,255,.06);color:#fff}
.acc-item.active{background:var(--gold);color:white;font-weight:400}
.acc-item.dragging{opacity:.35}
.acc-item.drag-over{box-shadow:inset 0 2px 0 var(--gold)}
.nav-divider{height:.5px;background:rgba(255,255,255,.08);margin:8px 3px}
.nav-wordmark{padding:14px 14px 8px;font-family:'Cormorant Garamond',serif;font-size:13px;font-style:italic;color:rgba(255,255,255,.25);letter-spacing:.08em}

/* Form elements */
.card{background:var(--ivory);border-radius:6px;padding:16px;margin-bottom:14px}
.card-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:9px 12px;border:.5px solid var(--border);background:white;color:var(--noir);outline:none;border-radius:4px;transition:border-color .2s}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{resize:vertical;line-height:1.7;min-height:90px}
.field-hint{font-size:11px;color:var(--muted);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Image upload */
.img-upload{border:1px dashed var(--border);border-radius:4px;background:var(--ivory);padding:14px;text-align:center;cursor:pointer;transition:border-color .2s}
.img-upload:hover{border-color:var(--gold)}
.img-upload p{font-size:12px;color:var(--muted);margin-top:6px}
.img-upload img{max-height:120px;max-width:100%;border-radius:3px;display:block;margin:0 auto}

/* Back link */
.back-link{background:none;border:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:0;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px}
.back-link:hover{color:var(--noir)}

/* Form actions */
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn-save{padding:9px 22px;background:var(--noir);color:white;border:none;border-radius:4px;font-size:12px;letter-spacing:.06em;cursor:pointer}
.btn-save:hover{background:var(--gold)}
.btn-cancel{padding:9px 16px;border:.5px solid var(--border);background:transparent;border-radius:4px;font-size:12px;color:var(--muted);cursor:pointer}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;background:var(--noir);color:white;font-size:13px;border-radius:6px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.success{background:#2e7d32}
.toast.error{background:#c0392b}
</style>
</head>
<body>

<div id="login-overlay" style="position:fixed;inset:0;background:var(--cream);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="font-family:'Cormorant Garamond',serif;font-size:34px;font-style:italic;color:var(--noir)">Bureau</div>
  <input type="password" id="login-password" placeholder="Password" onkeydown="if(event.key==='Enter'){attemptLogin();}" style="width:220px;padding:10px 14px;border:.5px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;outline:none;text-align:center;background:white">
  <button id="login-btn" class="btn-save" onclick="attemptLogin()" style="width:220px">Enter</button>
  <div id="login-error" style="color:#c0392b;font-size:12px;min-height:16px"></div>
</div>

<div class="shell">

  <!-- LEFT: Preview -->
  <div class="preview-pane">
    <div class="preview-bar">
      <div class="preview-dot" style="background:#ff5f57"></div>
      <div class="preview-dot" style="background:#febc2e"></div>
      <div class="preview-dot" style="background:#28c840"></div>
      <span class="preview-url" id="preview-url">jetenvoieca.com</span>
      <button class="preview-refresh" id="preview-open-tab" onclick="openFramedSiteNewTab()" title="Some sites block being shown inside another page — open it directly instead" style="display:none">Open in New Tab</button>
      <button class="preview-refresh" onclick="refreshPreview()" title="Refresh">Refresh</button>
    </div>
    <iframe id="preview" src="/" title="Site preview" onload="handlePreviewLoad()"></iframe>
    <div id="preview-image-wrap" style="display:none;flex:1;align-items:center;justify-content:center;padding:60px;overflow:auto;background:var(--cream)">
      <img id="preview-image" style="display:none;max-width:70%;max-height:70%;object-fit:contain;border-radius:6px;box-shadow:0 10px 34px rgba(0,0,0,.14)">
      <div id="preview-image-fallback" style="display:none;flex-direction:column;align-items:center;gap:14px">
        <img id="preview-image-favicon" style="width:56px;height:56px;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.12)">
        <p id="preview-image-domain" style="font-size:13px;color:var(--muted);letter-spacing:.02em"></p>
      </div>
    </div>
  </div>

  <!-- MIDDLE: Edit -->
  <div class="edit-pane" id="edit-pane">
    <div class="edit-empty">
      <div class="edit-empty-logo">Jv</div>
      <p>Select a section from the menu to start editing</p>
    </div>
  </div>

  <!-- RIGHT: Nav -->
  <div class="nav-pane">
    <div class="nav-inner">
      <div class="nav-wordmark">Jetenvoieca</div>

      <div class="action-row">
        <button class="btn-publish" id="btn-publish" onclick="publish()">Publish</button>
        <div class="publish-status" id="publish-status">All changes published</div>
        <button onclick="logout()" style="background:none;border:none;color:rgba(255,255,255,.3);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:8px 0 0;width:100%;font-family:'Jost',sans-serif">Log Out</button>
      </div>

      <div class="nav-divider"></div>

      <!-- WEBSITE -->
      <div class="acc-group">
        <button class="acc-hd open" id="acc-pages" onclick="toggleAcc('pages')">
          Website <span class="chev">▼</span>
        </button>
        <div class="acc-body open" id="acc-body-pages">
          <div class="acc-items" id="acc-items-pages"></div>
        </div>
      </div>

      <div class="nav-divider"></div>

      <!-- EMAIL -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-email" onclick="toggleAcc('email')">
          Email <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-email">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('email-inbox')">Inbox</button>
          </div>
        </div>
      </div>

      <!-- MANAGEMENT -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-management" onclick="toggleAcc('management')">
          Management <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-management">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('sites-dashboard')">All Sites</button>
            <button class="acc-item" onclick="showView('domains-unassigned')">Unassigned Domains</button>
            <button class="acc-item" onclick="showView('domains-all')">All Domains</button>
          </div>
        </div>
      </div>

      <!-- CONTACTS -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-contacts" onclick="toggleAcc('contacts')">
          Contacts <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-contacts">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('contacts-all')">All Contacts</button>
            <button class="acc-item" onclick="showView('contacts-mailings')">E-Mailings</button>
            <button class="acc-item" onclick="showView('contacts-press')">Press Releases</button>
            <button class="acc-item" onclick="showView('contacts-support')">Support</button>
            <button class="acc-item" onclick="showView('contacts-settings')">Contact Settings</button>
          </div>
        </div>
      </div>

      <!-- FINANCIAL -->
      <div class="acc-group">
        <button class="acc-hd" id="acc-financial" onclick="toggleAcc('financial')">
          Financial <span class="chev">▼</span>
        </button>
        <div class="acc-body" id="acc-body-financial">
          <div class="acc-items">
            <button class="acc-item" onclick="showView('financial-accounts')">Accounts</button>
            <button class="acc-item" onclick="showView('financial-settings')">Financial Settings</button>
          </div>
        </div>
      </div>

    </div>
  </div>


</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var state = {
  currentView: null,
  content: {},   // content.json — home/story/contact/settings
  sites: [],     // sites.json
  domains: null, // domains.json
  contacts: [],  // contacts.json
  loaded: false
};

// GitHub is the only source of truth — no local storage. On load, pull the
// published files into memory. Everything Bureau reads and displays comes
// from these in-memory copies, kept in sync by autosave below.
async function loadAllFromGitHub(silent) {
  var contentOk = false;
  try {
    var res = await fetch('content.json', { cache: 'no-store' });
    if (res.ok) { state.content = await res.json(); contentOk = true; }
  } catch (err) { /* first publish hasn't happened yet */ }

  try {
    var sitesRes = await fetch('sites.json', { cache: 'no-store' });
    state.sites = sitesRes.ok ? await sitesRes.json() : [];
  } catch (err) { state.sites = []; }

  try {
    var domainsRes = await fetch('domains.json', { cache: 'no-store' });
    state.domains = domainsRes.ok ? await domainsRes.json() : null;
  } catch (err) { state.domains = null; }

  try {
    var contactsRes = await fetch('contacts.json', { cache: 'no-store' });
    state.contacts = contactsRes.ok ? await contactsRes.json() : [];
  } catch (err) { state.contacts = []; }

  state.loaded = true;
  renderPagesNav();
  if (state.currentView) showView(state.currentView);
  if (!silent) {
    if (contentOk) toast('Loaded from GitHub ✓', 'success');
    else toast('Nothing published yet — start editing to create it', 'error');
  }
}

// ── AUTOSAVE ─────────────────────────────────────────────────────────────────
// Every field writes to GitHub after you pause typing — no Save button.
// Debounced per-target so rapid edits collapse into one write, not one per
// keystroke. This uses the exact same publishFile() call Publish itself
// uses — deploys are still only triggered however Publish already triggers
// them, autosave just keeps GitHub itself current at all times.
function debounce(fn, delay) {
  var timer = null;
  return function() {
    var args = arguments;
    clearTimeout(timer);
    state.pendingAutosave = true;
    setAutosaveStatus('pending');
    timer = setTimeout(function() { fn.apply(null, args); }, delay);
  };
}

function setAutosaveStatus(state) {
  var status = document.getElementById('publish-status');
  if (!status) return;
  if (state === 'pending') { status.textContent = 'Saving…'; status.className = 'publish-status pending'; }
  else if (state === 'saved') { status.textContent = 'Saved to GitHub ✓'; status.className = 'publish-status'; }
  else if (state === 'error') { status.textContent = 'Autosave failed'; status.className = 'publish-status pending'; }
}

var autosaveContent = debounce(async function() {
  try {
    await publishFile('content', JSON.stringify(state.content, null, 2), 'Autosave content.json via Bureau');
    state.pendingAutosave = false;
    setAutosaveStatus('saved');
  } catch (err) {
    setAutosaveStatus('error');
    toast('Autosave failed: ' + err.message, 'error');
  }
}, 1500);

var autosaveSites = debounce(async function() {
  try {
    await publishFile('sites', JSON.stringify(state.sites, null, 2), 'Autosave sites.json via Bureau');
    state.pendingAutosave = false;
    setAutosaveStatus('saved');
  } catch (err) {
    setAutosaveStatus('error');
    toast('Autosave failed: ' + err.message, 'error');
  }
}, 1500);

var autosaveContacts = debounce(async function() {
  try {
    await publishFile('contacts', JSON.stringify(state.contacts, null, 2), 'Autosave contacts.json via Bureau');
    state.pendingAutosave = false;
    setAutosaveStatus('saved');
  } catch (err) {
    setAutosaveStatus('error');
    toast('Autosave failed: ' + err.message, 'error');
  }
}, 1500);

// Domains change via discrete actions (import/sync), not typing, so this
// writes immediately rather than debouncing.
async function autosaveDomainsNow() {
  setAutosaveStatus('pending');
  try {
    await publishFile('domains', JSON.stringify(state.domains, null, 2), 'Update domains.json via Bureau');
    setAutosaveStatus('saved');
  } catch (err) {
    setAutosaveStatus('error');
    toast('Autosave failed: ' + err.message, 'error');
  }
}

async function publish() {
  var btn = document.getElementById('btn-publish');
  var status = document.getElementById('publish-status');
  btn.disabled = true;
  status.textContent = 'Publishing…';
  status.className = 'publish-status pending';

  try {
    await publishFile('content', JSON.stringify(state.content, null, 2), 'Update content.json via Bureau');
    await publishFile('sites', JSON.stringify(state.sites, null, 2), 'Update sites.json via Bureau');
    await publishFile('contacts', JSON.stringify(state.contacts, null, 2), 'Update contacts.json via Bureau');
    if (state.domains) {
      await publishFile('domains', JSON.stringify(state.domains, null, 2), 'Update domains.json via Bureau');
    }
    setAutosaveStatus('saved');
    toast('Published to GitHub ✓', 'success');
    setTimeout(refreshPreview, 1500); // give Netlify a moment to rebuild
  } catch (err) {
    status.textContent = 'Publish failed';
    status.className = 'publish-status pending';
    toast('Publish failed: ' + err.message, 'error');
  }
  btn.disabled = false;
}

async function publishFile(target, content, message) {
  var res = await authFetch('/.netlify/functions/publish-content', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: target, content: content, message: message })
  });
  var json = await res.json();
  if (!res.ok) throw new Error(json.error || ('Publish failed (' + res.status + ')'));
  return json;
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ── ACCORDION ────────────────────────────────────────────────────────────────
function toggleAcc(id) {
  var hd = document.getElementById('acc-' + id);
  var body = document.getElementById('acc-body-' + id);
  var opening = !hd.classList.contains('open');

  document.querySelectorAll('.acc-hd').forEach(function(h) { h.classList.remove('open'); });
  document.querySelectorAll('.acc-body').forEach(function(b) { b.classList.remove('open'); });

  if (opening) {
    hd.classList.add('open');
    body.classList.add('open');
  }
}

// ── PREVIEW ──────────────────────────────────────────────────────────────────
var previewMode = 'site'; // 'site' | 'dashboard'
var framedSite = null;    // the site object currently loaded in the iframe via loadSiteInFrame, if any

function refreshPreview() {
  var iframe = document.getElementById('preview');
  iframe.src = iframe.src;
}

function openFramedSiteNewTab() {
  if (framedSite) window.open(framedSite.url, '_blank');
}

function setFramedSiteButton(site) {
  var btn = document.getElementById('preview-open-tab');
  framedSite = site;
  if (btn) btn.style.display = site ? '' : 'none';
}

function setPreview(mode, page) {
  var iframe = document.getElementById('preview');
  var wrap = document.getElementById('preview-image-wrap');
  var urlLabel = document.getElementById('preview-url');
  previewMode = mode;

  wrap.style.display = 'none';
  iframe.style.display = '';
  setFramedSiteButton(null);

  // Relative paths (not the absolute jetenvoieca.com domain) — guarantees
  // the iframe is same-origin as Bureau no matter which URL Bureau itself is
  // opened from (custom domain or the netlify.app subdomain), which is what
  // lets applyDraftToFrame reach into it below.
  if (mode === 'dashboard') {
    iframe.src = '/dashboard.html';
    urlLabel.textContent = 'jetenvoieca.com/dashboard';
  } else {
    var path = page || 'index.html';
    iframe.src = '/' + (path === 'index.html' ? '' : path);
    urlLabel.textContent = 'jetenvoieca.com' + (path === 'index.html' ? '' : '/' + path);
  }
  var btn = document.getElementById('sites-preview-toggle');
  if (btn) btn.textContent = (mode === 'dashboard' ? 'Show Site' : 'Show Dashboard');
}

// Fires when the preview iframe finishes loading. If we're showing the live
// site, pushes whatever's currently saved in Bureau (not yet Published) into
// the loaded page directly — so the preview reflects your draft, not just
// whatever was last published to GitHub.
function handlePreviewLoad() {
  if (previewMode === 'site') applyDraftToFrame();
}

// Detects which page is currently loaded in the frame (by which known
// elements exist in it) and injects the matching draft content — so this
// keeps working automatically as more pages get added later.
function applyDraftToFrame() {
  var iframe = document.getElementById('preview');
  if (!iframe || previewMode !== 'site') return;
  var doc;
  try { doc = iframe.contentDocument; } catch (e) { return; } // cross-origin — leave the last-loaded page as-is
  if (!doc || !doc.getElementById) return;

  if (doc.getElementById('story-title')) {
    var s = (state.content && state.content.story) || {};
    setFrameText(doc, 'story-title', s.title); setFrameText(doc, 'story-subtitle', s.subtitle);
    setFrameText(doc, 'story-c1', s.chapter1); setFrameText(doc, 'story-c2', s.chapter2); setFrameText(doc, 'story-c3', s.chapter3);
    var hs = (state.content && state.content.home) || {};
    setFrameText(doc, 'footer-location', hs.location);
    if (hs.email) {
      var emailElS = doc.getElementById('footer-email');
      if (emailElS) { emailElS.textContent = hs.email; emailElS.href = 'mailto:' + hs.email; }
    }
    return;
  }

  if (doc.getElementById('contact-intro')) {
    var c = (state.content && state.content.contact) || {};
    setFrameText(doc, 'contact-intro', c.intro);
    setFrameText(doc, 'contact-location', c.location);
    if (c.email) {
      var emailElC = doc.getElementById('contact-email');
      if (emailElC) { emailElC.textContent = c.email; emailElC.href = 'mailto:' + c.email; }
    }
    return;
  }

  if (doc.getElementById('artists-title')) {
    var a = (state.content && state.content.artists) || {};
    setFrameText(doc, 'artists-eyebrow', a.eyebrow); setFrameText(doc, 'artists-title', a.title);
    setFrameText(doc, 'artists-body', a.body); setFrameText(doc, 'artists-cta', a.cta);
    return;
  }

  if (doc.getElementById('retail-title')) {
    var r = (state.content && state.content.retail) || {};
    setFrameText(doc, 'retail-eyebrow', r.eyebrow); setFrameText(doc, 'retail-title', r.title);
    setFrameText(doc, 'retail-body', r.body); setFrameText(doc, 'retail-cta', r.cta);
    return;
  }

  // Generic custom pages (page.html?slug=xxx) — reuse the page's own render
  // function directly rather than duplicating its markup logic here.
  if (doc.getElementById('page-content') && iframe.contentWindow && typeof iframe.contentWindow.PAGE_SLUG === 'string') {
    var pages = (state.content && state.content.pages) || [];
    var pg = pages.find(function(p) { return p.slug === iframe.contentWindow.PAGE_SLUG; });
    if (pg && pg.visible !== false && iframe.contentWindow.renderPage) {
      iframe.contentWindow.renderPage(pg);
    } else if (iframe.contentWindow.renderNotFound) {
      iframe.contentWindow.renderNotFound();
    }
    return;
  }

  var h = (state.content && state.content.home) || {};
  setFrameText(doc, 'eyebrow-1', h.eyebrow1); setFrameText(doc, 'title-1', h.title1); setFrameText(doc, 'body-1', h.body1);
  setFrameText(doc, 'eyebrow-2', h.eyebrow2); setFrameText(doc, 'title-2', h.title2); setFrameText(doc, 'body-2', h.body2);
  setFrameText(doc, 'eyebrow-3', h.eyebrow3); setFrameText(doc, 'title-3', h.title3); setFrameText(doc, 'body-3', h.body3);
  setFrameText(doc, 'footer-location', h.location);
  if (h.email) {
    var emailEl = doc.getElementById('footer-email');
    if (emailEl) { emailEl.textContent = h.email; emailEl.href = 'mailto:' + h.email; }
  }
  if (h.image) {
    var heroImg = doc.getElementById('hero-image');
    var heroSvg = doc.querySelector('.left svg');
    if (heroImg) { heroImg.src = h.image; heroImg.style.display = 'block'; }
    if (heroSvg) heroSvg.style.display = 'none';
  }
}

function setFrameText(doc, id, value) {
  if (!value) return;
  var el = doc.getElementById(id);
  if (el) el.textContent = value;
}

// Shows a single site's screenshot in the preview pane, generously spaced —
// no grid, no page chrome, just the image (falls back to favicon + domain
// if no screenshot is available).
function showSiteImage(site) {
  var iframe = document.getElementById('preview');
  var wrap = document.getElementById('preview-image-wrap');
  var img = document.getElementById('preview-image');
  var fallback = document.getElementById('preview-image-fallback');
  var urlLabel = document.getElementById('preview-url');

  iframe.style.display = 'none';
  wrap.style.display = 'flex';
  wrap.style.cursor = 'pointer';
  wrap.onclick = function() { loadSiteInFrame(site); };
  urlLabel.textContent = hostnameOf(site.url);
  setFramedSiteButton(null); // showing the static image, not the framed site yet

  img.style.display = '';
  fallback.style.display = 'none';
  img.onerror = function() {
    img.style.display = 'none';
    fallback.style.display = 'flex';
    document.getElementById('preview-image-favicon').src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(site.url) + '&sz=64';
    document.getElementById('preview-image-domain').textContent = hostnameOf(site.url);
  };
  img.src = site.image || ('https://s0.wordpress.com/mshots/v1/' + encodeURIComponent(site.url) + '?w=1200&h=800');
  img.alt = site.name;
}

// Clicking the preview image swaps it for the live site, still in the same
// pane. Some sites block being framed this way (X-Frame-Options/CSP), which
// shows as a blank/broken page with no detectable JS error — so the "Open in
// New Tab" button in the preview bar stays available as a manual fallback.
function loadSiteInFrame(site) {
  var iframe = document.getElementById('preview');
  var wrap = document.getElementById('preview-image-wrap');
  var urlLabel = document.getElementById('preview-url');
  wrap.style.display = 'none';
  iframe.style.display = '';
  iframe.src = site.url;
  urlLabel.textContent = hostnameOf(site.url);
  setFramedSiteButton(site);
}

function hostnameOf(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch (e) { return url; }
}

// Shows a thumbnail next to a file input as soon as a file is chosen —
// purely visual, doesn't resize; the real resize happens on Save.
function previewImageFile(inputId, previewImgId) {
  var input = document.getElementById(inputId);
  var img = document.getElementById(previewImgId);
  var file = input && input.files && input.files[0];
  if (!file || !img) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    img.src = e.target.result;
    img.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

  else if (view === 'artists') { pane.innerHTML = viewArtists(); setPreview('site', 'artists.html'); }
  else if (view === 'retail') { pane.innerHTML = viewRetail(); setPreview('site', 'retail.html'); }
  else if (view === 'story') { pane.innerHTML = viewStory(); setPreview('site', 'story.html'); }
  else if (view === 'contact') { pane.innerHTML = viewContact(); setPreview('site', 'contact.html'); }
  else if (view === 'sites-dashboard') { pane.innerHTML = viewSites(); setPreview('dashboard'); }
  else if (view === 'domains-all' || view === 'domains-unassigned') pane.innerHTML = viewDomains(view);
  else if (view === 'domains-sync') pane.innerHTML = viewNcSync();
  else if (view === 'settings-site') { pane.innerHTML = viewSiteSettings(); setPreview('site', 'index.html'); }
  else if (view === 'financial-accounts') pane.innerHTML = viewFinancialAccounts();
  else if (view === 'financial-settings') pane.innerHTML = viewFinancialSettings();
  else if (view === 'contacts-all') pane.innerHTML = viewAllContacts();
  else if (view === 'contacts-settings') pane.innerHTML = viewContactSettings();
  else if (view === 'contacts-mailings') pane.innerHTML = viewComingSoon('E-Mailings');
  else if (view === 'contacts-press') pane.innerHTML = viewComingSoon('Press Releases');
  else if (view === 'contacts-support') pane.innerHTML = viewComingSoon('Support');
  else if (view === 'email-inbox') { pane.innerHTML = viewEmailInbox(); loadEmailInbox(); }
  else if (view.indexOf('page:') === 0) {
    var pgId = view.slice(5);
    pane.innerHTML = viewSingleCustomPage(pgId);

    setPreview('site', 'page.html?slug=' + encodeURIComponent(pg ? pg.slug : ''));
  }
  else pane.innerHTML = '<div class="edit-inner"><p style="color:var(--muted);font-size:13px;margin-top:40px;text-align:center">Coming soon</p></div>';

  wireView(view);
}

function filterSitesData(sites, term) {
  var q = (term || '').trim().toLowerCase();
  if (!q) return sites;
  return sites.filter(function(s) {
    return (s.name || '').toLowerCase().indexOf(q) > -1 || (s.url || '').toLowerCase().indexOf(q) > -1;
  });
}

function renderSitesRows(sites) {
  if (sites.length === 0) {
    return '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">No matching sites</p>';
  }

  return sites.map(function(s) {
    var open = expandedSiteId === s.id;
    var row = '<div onclick="selectSite(\'' + s.id + '\')" style="display:flex;align-items:center;padding:10px 0;gap:10px;cursor:pointer;' +
      (open
        ? 'background:var(--ivory);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px 4px 0 0'
        : 'border-bottom:.5px solid var(--border)') + '">' +
      '<div style="flex:1;min-width:0">' +
      '<div style="font-family:\'Cormorant Garamond\',serif;font-size:15px;font-style:italic">' + (esc(s.name) || '<span style="color:var(--muted);font-style:normal">Untitled site</span>') + '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:2px">' + esc(s.url||'') + '</div></div>' +
      (s.sub_amount ? '<span style="font-size:11px;color:var(--gold);flex-shrink:0">£' + esc(s.sub_amount) + '/mo</span>' : '') +
      (s.verified ? '<span style="width:18px;height:18px;border-radius:50%;background:#2e7d32;color:white;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0">✓</span>' : '') +
      '</div>';
    var panel = '';
    if (editingSiteId === s.id) panel = renderSiteEditForm(s);
    else if (open) panel = renderSiteDetail(s);
    return row + panel;
  }).join('');
}

// clicked. Edit is the further step into the actual edit form.

// Clicking a site row opens both the image preview and the read-only detail
// panel beneath it. Clicking the same row again collapses both. Edit (inside
// the detail panel) is the further step into the actual edit form.
function selectSite(id) {
  if (expandedSiteId === id) {
    expandedSiteId = null;
    editingSiteId = null;
    setPreview(previewMode);
  } else {
    expandedSiteId = id;
    editingSiteId = null;
    var site = state.sites.find(function(s) { return s.id === id; });
    if (site) showSiteImage(site);
  }
  refreshSitesList();
}

function startEditSite(id) {
  editingSiteId = id;
  expandedSiteId = id;
  var site = state.sites.find(function(s) { return s.id === id; });
  if (site) showSiteImage(site);
  refreshSitesList();
}

// Closes the edit panel. If it was a just-created "Add Site" record that's
// still completely blank, quietly removes it rather than leaving a ghost
// entry in sites.json.
function closeSiteForm(id) {
  var site = state.sites.find(function(s) { return s.id === id; });
  if (site && !site.name && !site.url) {
    state.sites = state.sites.filter(function(s) { return s.id !== id; });
    autosaveSites();
  }
  editingSiteId = null;
  expandedSiteId = null;
  setPreview(previewMode);
  refreshSitesList();
  refreshSitesHeader();
}

function onSiteFieldChange(id) {
  var url = val('se-url-' + id).trim();
  state.sites = state.sites.map(function(s) {
    if (s.id !== id) return s;
    return Object.assign({}, s, {
      name: val('se-name-' + id).trim(),
      artistFirstName: val('se-artist-first-' + id).trim(),
      artistLastName: val('se-artist-last-' + id).trim(),
      email: val('se-email-' + id).trim(),
      url: url,
      sub_method: val('se-method-' + id),
      sub_amount: val('se-amount-' + id).trim(),
      notes: val('se-notes-' + id).trim(),
      verified: document.getElementById('se-verified-' + id).checked
    });
  });
  refreshSitesHeader();
  syncSiteToContact(id);
  autosaveSites();
}

// Site ↔ Contact sync — Artist First/Last Name and Email map directly onto
// Contact fields with no lossy guessing, since Sites now store the name in
// the same first/last shape Contacts use.
function findLinkedContact(siteId) {
  var site = state.sites.find(function(s) { return s.id === siteId; });
  if (!site || !site.contactId) return null;
  return findContact(site.contactId);
}

function findLinkedSite(contactId) {
  return state.sites.find(function(s) { return s.contactId === contactId; });
}

function syncSiteToContact(siteId) {
  var site = state.sites.find(function(s) { return s.id === siteId; });
  if (!site || !site.contactId) return;
  var contact = findContact(site.contactId);
  if (!contact) return;
  state.contacts = state.contacts.map(function(c) {
    if (c.id !== contact.id) return c;
    return Object.assign({}, c, {
      firstName: site.artistFirstName || '',
      lastName: site.artistLastName || '',
      email: site.email || ''
    });
  });
  autosaveContacts();
}

function syncContactToSite(contactId) {
  var contact = findContact(contactId);
  var site = findLinkedSite(contactId);
  if (!contact || !site) return;
  state.sites = state.sites.map(function(s) {
    if (s.id !== site.id) return s;
    return Object.assign({}, s, {
      artistFirstName: contact.firstName || '',
      artistLastName: contact.lastName || '',
      email: contact.email || ''
    });
  });
  autosaveSites();
}

async function onSiteImageChange(id) {
  var newImage;
  try {
    newImage = await readAndResizeImage('se-image-' + id);

    toast(err.message, 'error');
    return;
  }
  if (!newImage) return;
  state.sites = state.sites.map(function(s) {
    return s.id === id ? Object.assign({}, s, { image: newImage }) : s;

  var updated = state.sites.find(function(s) { return s.id === id; });
  if (updated) showSiteImage(updated);
  autosaveSites();
}

// Matches dashboard.html's resize settings — same fix (never upscale, was
// the main cause of blur) and same higher-quality target.
var IMAGE_MAX_W = 900, IMAGE_MAX_H = 600, IMAGE_QUALITY = 0.85;

function readAndResizeImage(fileInputId, maxW, maxH, quality) {
  maxW = maxW || IMAGE_MAX_W;
  maxH = maxH || IMAGE_MAX_H;
  quality = quality || IMAGE_QUALITY;
  return new Promise(function(resolve, reject) {
    var input = document.getElementById(fileInputId);
    var file = input && input.files && input.files[0];
    if (!file) { resolve(null); return; }

    var settled = false;
    var done = function(fn, arg) { if (!settled) { settled = true; fn(arg); } };

    // Safety net — some formats (HEIC straight off an iPhone/Mac is the
    // common case) silently fail to decode in some browsers: neither
    // img.onload nor img.onerror ever fires, which used to hang forever
    // with no feedback at all.
    var timeout = setTimeout(function() {
      done(reject, new Error('That image took too long to process — try a JPG or PNG instead of HEIC'));
    }, 8000);

    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        try {
          var ratio = Math.min(maxW / img.width, maxH / img.height, 1); // never upscale
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          var dataUrl = canvas.toDataURL('image/jpeg', quality);
          clearTimeout(timeout);
          done(resolve, dataUrl);
        } catch (err) {
          clearTimeout(timeout);
          done(reject, new Error('Could not process that image — try a JPG or PNG instead'));
        }
      };
      img.onerror = function() {
        clearTimeout(timeout);
        done(reject, new Error('Could not read that image — try a JPG or PNG instead of HEIC'));
      };
      img.src = e.target.result;
    };
    reader.onerror = function() {
      clearTimeout(timeout);
      done(reject, new Error('Could not read that file'));
    };
    reader.readAsDataURL(file);
  });
}

function mrr(sites) {
  return sites.reduce(function(sum, s) { return sum + (parseFloat(s.sub_amount) || 0); }, 0);
}

function exportSitesCSV() {
  var sites = state.sites;
  if (sites.length === 0) { toast('No sites to export', 'error'); return; }

  var headers = ['Website Name', 'Artist First Name', 'Artist Last Name', 'Email', 'URL', 'Payment Method', 'Monthly Amount (£)', 'Domain Owned', 'Verified', 'Notes'];
  var rows = sites.map(function(s) {
    return [
      s.name, s.artistFirstName || '', s.artistLastName || '', s.email || '', s.url, s.sub_method || '', s.sub_amount || '',
      s.domain_owned ? 'Yes' : 'No', s.verified ? 'Yes' : 'No', s.notes || ''
    ].map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; });
  });
  var csv = [headers.map(function(h) { return '"' + h + '"'; })].concat(rows).map(function(r) { return r.join(','); }).join('\r\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jetenvoieca-sites.csv';
  a.click();
  toast('CSV exported ✓', 'success');
}

// ── DOMAINS VIEW ──────────────────────────────────────────────────────────────
function viewDomains(view) {
  var ncData = state.domains;
  if (!ncData) {
    return '<div class="edit-inner"><div class="sticky-hd" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
      '<div class="edit-title">Domains</div>' +
      '<button class="btn-cancel" onclick="showView(\'domains-sync\')">NC Sync</button>' +
      '</div>' +
      '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">No domain data yet.<br>Use NC Sync to import your Namecheap domains.</p></div>';
  }

  var sites = state.sites;

  function hostname(url) {
    try { return new URL(url).hostname.replace('www.',''); } catch(e) { return url; }
  }

  function formatExpiry(d) {
    var dt = new Date(d);
    var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return dt.getDate() + ' ' + m[dt.getMonth()] + ' ' + dt.getFullYear();
  }

  function expiryColor(d) {
    var days = (new Date(d) - new Date()) / (1000*60*60*24);
    return days < 30 ? '#c0392b' : days < 90 ? '#e67e22' : 'var(--muted)';
  }

  var siteHosts = sites.map(function(s) { return hostname(s.url).toLowerCase(); });
  var all = ncData.domains.slice().sort(function(a,b){ return new Date(a.expiry)-new Date(b.expiry); });
  var unassigned = all.filter(function(d){ return !siteHosts.includes(d.name.toLowerCase()); });
  var list = view === 'domains-unassigned' ? unassigned : all;
  var title = view === 'domains-unassigned' ? 'Unassigned Domains' : 'All Domains';

  var rows = list.map(function(d) {
    var color = expiryColor(d.expiry);
    var assigned = sites.find(function(s){ return hostname(s.url).toLowerCase() === d.name.toLowerCase(); });
    return '<div style="display:flex;align-items:center;padding:9px 0;border-bottom:.5px solid var(--border);gap:10px">' +
      '<a href="http://'+d.name+'" target="_blank" style="flex:1;font-size:13px;color:var(--noir);text-decoration:none">' + d.name + '</a>' +
      (assigned ? '<span style="font-size:11px;color:var(--muted)">' + esc(assigned.name) + '</span>' : '') +
      '<span style="font-size:11px;color:'+color+'">' + formatExpiry(d.expiry) + '</span>' +
      '</div>';
  }).join('');

  return '<div class="edit-inner">' +
    '<div class="sticky-hd" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
    '<div><div class="edit-title">' + title + '</div>' +
    '<div class="edit-sub">' + list.length + ' domains · fetched ' + new Date(ncData.fetched).toLocaleDateString('en-GB') + '</div></div>' +
    '<button class="btn-cancel" onclick="showView(\'domains-sync\')">NC Sync</button>' +
    '</div>' +
    (list.length === 0 ? '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">✓ All domains assigned</p>' : '<div>' + rows + '</div>') +
    '</div>';
}

async function importDomains(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = async function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.domains) throw new Error('Invalid format');
      state.domains = data;

      function hostname(url) { try { return new URL(url).hostname.replace('www.',''); } catch(ex) { return url; } }
      var matched = 0;
      var siteHosts = state.sites.map(function(s){ return hostname(s.url).toLowerCase(); });
      var unassigned = data.domains.filter(function(d){ return !siteHosts.includes(d.name.toLowerCase()); });

      state.sites = state.sites.map(function(s) {
        var host = hostname(s.url);
        var match = data.domains.find(function(d){ return d.name.toLowerCase() === host.toLowerCase(); });
        if (match) { matched++; return Object.assign({}, s, { nc_expiry: match.expiry, nc_synced: new Date().toISOString(), domain_owned: true }); }
        return Object.assign({}, s, { domain_owned: false });
      });

      var status = document.getElementById('nc-status');
      if (status) {
        status.style.color = 'var(--muted)';
        status.textContent = 'Saving to GitHub…';
      }

      await autosaveDomainsNow();
      await publishFile('sites', JSON.stringify(state.sites, null, 2), 'Update sites.json via NC Sync import');

      if (status) {
        status.style.color = '#2e7d32';
        status.textContent = '✓ ' + matched + ' cards matched · ' + data.domains.length + ' domains · ' + unassigned.length + ' unassigned';
      }
      input.value = '';
      toast('Domains imported and saved to GitHub ✓', 'success');
    } catch(err) {
      toast('Import failed: ' + err.message, 'error');
      input.value = '';
    }
  };
  reader.readAsText(file);
}
