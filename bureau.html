  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">Financial Settings</div><div class="edit-sub">Rates used across invoicing and accounts</div></div>' +
    '<div class="card"><div class="card-title">Rates</div>' +
    '<div class="field"><label>VAT Rate (%)</label><input id="fs-vat" oninput="onFinancialSettingsFieldChange()" value="' + esc(c.vatRate || '') + '" placeholder="e.g. 20"></div>' +
    '<div class="field"><label>Urssaf Rate (%)</label><input id="fs-urssaf" oninput="onFinancialSettingsFieldChange()" value="' + esc(c.urssafRate || '') + '" placeholder="e.g. 22"></div>' +
    '</div>' +
    '</div>';
}

function onFinancialSettingsFieldChange() {
  state.content.financial = {
    vatRate: val('fs-vat'), urssafRate: val('fs-urssaf')
  };
  autosaveContent();
}

function viewComingSoon(title) {
  return '<div class="edit-inner"><div class="sticky-hd"><div class="edit-title">' + esc(title) + '</div><div class="edit-sub">Coming soon</div></div>' +
    '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">Not built yet</p></div>';
}

// ── CONTACT SETTINGS (sources + tags) ─────────────────────────────────────────
function getContactSettings() {
  if (!state.content.contactSettings) {
    state.content.contactSettings = { sources: [], tags: [] };
  }
  if (!state.content.contactSettings.sources) state.content.contactSettings.sources = [];
  if (!state.content.contactSettings.tags) state.content.contactSettings.tags = [];
  return state.content.contactSettings;
}

function viewContactSettings() {
  var cs = getContactSettings();
  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">Contact Settings</div><div class="edit-sub">Manage the sources and tags used across all contacts.</div></div>' +
    '<div class="card">' +
    '<div class="card-title" style="color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:11px">Sale Sources</div>' +
    '<div id="cs-sources-list" style="margin-top:10px">' + renderChipList(cs.sources, 'sources') + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:6px">' +
    '<input id="cs-new-source" placeholder="New source…" onkeydown="if(event.key===\'Enter\'){addSource();}" style="flex:1;padding:9px 12px;border:.5px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;outline:none">' +
    '<button class="btn-save" onclick="addSource()">Add</button>' +
    '</div></div>' +
    '<div class="card">' +
    '<div class="card-title" style="color:var(--gold);text-transform:uppercase;letter-spacing:.08em;font-size:11px">Tags</div>' +
    '<div class="field-hint" style="margin-bottom:10px">Each becomes its own shortcut under Contacts.</div>' +
    '<div id="cs-tags-list">' + renderChipList(cs.tags, 'tags') + '</div>' +
    '<div style="display:flex;gap:8px;margin-top:6px">' +
    '<input id="cs-new-tag" placeholder="New tag…" onkeydown="if(event.key===\'Enter\'){addTag();}" style="flex:1;padding:9px 12px;border:.5px solid var(--border);border-radius:4px;font-family:inherit;font-size:13px;outline:none">' +
    '<button class="btn-save" onclick="addTag()">Add</button>' +
    '</div></div>' +
    '</div>';
}

function renderChipList(items, kind) {
  if (!items.length) return '<p style="font-size:12px;color:var(--muted)">None yet</p>';
  return items.map(function(item, idx) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;background:white;border:.5px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:8px">' +
      '<span style="font-size:13px">' + esc(item) + '</span>' +
      '<button onclick="removeChip(\'' + kind + '\',' + idx + ')" style="background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 6px;line-height:1">×</button>' +
      '</div>';
  }).join('');
}

function addSource() {
  var v = val('cs-new-source').trim();
  if (!v) return;
  var cs = getContactSettings();
  if (cs.sources.indexOf(v) === -1) cs.sources.push(v);
  refreshContactSettings();
  autosaveContent();
}

function addTag() {
  var v = val('cs-new-tag').trim();
  if (!v) return;
  var cs = getContactSettings();
  if (cs.tags.indexOf(v) === -1) cs.tags.push(v);
  refreshContactSettings();
  autosaveContent();
}

function removeChip(kind, idx) {
  getContactSettings()[kind].splice(idx, 1);
  refreshContactSettings();
  autosaveContent();
}

function refreshContactSettings() {
  var pane = document.getElementById('edit-pane');
  if (pane) pane.innerHTML = viewContactSettings();
}

// ── ALL CONTACTS ───────────────────────────────────────────────────────────────
var expandedContactId = null;
var editingContactId = null;

function findContact(id) {
  return (state.contacts || []).find(function(c) { return c.id === id; });
}

function viewAllContacts() {
  var contacts = state.contacts || [];
  return '<div class="edit-inner">' +
    '<div class="sticky-hd" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
    '<div><div class="edit-title">All Contacts</div><div class="edit-sub">' + contacts.length + ' contact' + (contacts.length === 1 ? '' : 's') + '</div></div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn-cancel" onclick="importContactsFromSites()">Import from Sites</button>' +
    '<button class="btn-cancel" onclick="startAddContact()">Add Contact</button>' +
    '</div></div>' +
    '<div id="contacts-list">' + renderContactsRows(contacts) + '</div>' +
    '</div>';
}

function renderContactsRows(contacts) {
  if (contacts.length === 0) {
    return '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">No contacts yet</p>';
  }
  var header = '<div style="display:flex;gap:10px;padding:6px 0;border-bottom:.5px solid var(--border);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">' +
    '<div style="flex:1">First Name</div><div style="flex:1">Surname</div><div style="flex:1.2">Business</div><div style="flex:1.4">Email</div></div>';
  var rows = contacts.map(function(c) {
    var editing = editingContactId === c.id;
    var row = '<div onclick="selectContact(\'' + c.id + '\')" style="display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;' +
      (editing ? 'background:var(--ivory);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px 4px 0 0' : 'border-bottom:.5px solid var(--border)') + '">' +
      '<div style="flex:1;font-size:13px">' + (esc(c.firstName) || '—') + '</div>' +
      '<div style="flex:1;font-size:13px">' + (esc(c.lastName) || '—') + '</div>' +
      '<div style="flex:1.2;font-size:13px;color:var(--muted)">' + (esc(c.business) || '—') + '</div>' +
      '<div style="flex:1.4;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (esc(c.email) || '—') + '</div>' +
      '</div>';
    var panel = editing ? renderContactEditForm(c) : '';
    return row + panel;
  }).join('');
  return header + rows;
}

function renderContactEditForm(c) {
  var id = c.id;
  var cs = getContactSettings();
  var linkedSite = findLinkedSite(id);
  var sourceOptions = '<option value=""' + (!c.source ? ' selected' : '') + '>Select…</option>' +
    cs.sources.map(function(s) { return '<option' + (c.source === s ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
  var tagBoxes = cs.tags.map(function(t) {
    var checked = (c.tags || []).indexOf(t) > -1;
    return '<label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 14px 8px 0;cursor:pointer">' +
      '<input type="checkbox" data-tag="' + esc(t) + '" onchange="onContactRecordFieldChange(\'' + id + '\')" style="width:auto"' + (checked ? ' checked' : '') + '> ' + esc(t) + '</label>';
  }).join('');

  return '<div onclick="event.stopPropagation()" style="padding:16px 12px 18px;background:var(--ivory);border-radius:0 0 6px 6px;margin-bottom:2px">' +
    (linkedSite ? '<div style="font-size:11px;color:var(--muted);margin-bottom:12px">🔗 Linked to site: ' + esc(linkedSite.name) + '</div>' : '') +
    '<div class="field-row">' +
    '<div class="field"><label>First Name</label><input id="ct-first-' + id + '" oninput="onContactRecordFieldChange(\'' + id + '\')" value="' + esc(c.firstName) + '"></div>' +
    '<div class="field"><label>Surname</label><input id="ct-last-' + id + '" oninput="onContactRecordFieldChange(\'' + id + '\')" value="' + esc(c.lastName) + '"></div>' +
    '</div>' +
    '<div class="field"><label>Business</label><input id="ct-business-' + id + '" oninput="onContactRecordFieldChange(\'' + id + '\')" value="' + esc(c.business||'') + '"></div>' +
    '<div class="field"><label>Email</label><input id="ct-email-' + id + '" oninput="onContactRecordFieldChange(\'' + id + '\')" value="' + esc(c.email||'') + '"></div>' +
    '<div class="field"><label>Source</label><select id="ct-source-' + id + '" onchange="onContactRecordFieldChange(\'' + id + '\')">' + sourceOptions + '</select></div>' +
    '<div class="field"><label>Tags</label><div>' + (tagBoxes || '<span style="font-size:12px;color:var(--muted)">No tags yet — add some in Contact Settings</span>') + '</div></div>' +
    '<div class="form-actions" style="margin-top:6px">' +
    '<button class="btn-cancel" onclick="deleteContactInline(\'' + id + '\')">Delete</button>' +
    '<button class="btn-save" onclick="closeContactForm(\'' + id + '\')">Done</button>' +
    '</div></div>';
}

function refreshContactsList() {
  var container = document.getElementById('contacts-list');
  if (container) container.innerHTML = renderContactsRows(state.contacts || []);
}

function refreshContactsHeader() {
  var subEl = document.querySelector('#edit-pane .edit-sub');
  var n = (state.contacts || []).length;
  if (subEl) subEl.textContent = n + ' contact' + (n === 1 ? '' : 's');
}

// Clicking a row opens straight into edit — the row itself already shows the
// four list columns, so there's no separate read-only step needed here.
function selectContact(id) {
  if (editingContactId === id) {
    editingContactId = null;
    expandedContactId = null;
  } else {
    editingContactId = id;
    expandedContactId = id;
  }
  refreshContactsList();
}

// Closing an untouched just-added contact quietly removes it, same pattern as Sites/Pages.
function closeContactForm(id) {
  var c = findContact(id);
  if (c && !c.firstName && !c.lastName && !c.email) {
    state.contacts = (state.contacts || []).filter(function(x) { return x.id !== id; });
    autosaveContacts();
  }
  editingContactId = null;
  expandedContactId = null;
  refreshContactsList();
  refreshContactsHeader();
}

function onContactRecordFieldChange(id) {
  var tags = [];
  document.querySelectorAll('#contacts-list input[type=checkbox][data-tag]').forEach(function(cb) {
    if (cb.checked) tags.push(cb.getAttribute('data-tag'));
  });
  state.contacts = (state.contacts || []).map(function(c) {
    if (c.id !== id) return c;
    return Object.assign({}, c, {
      firstName: val('ct-first-' + id),
      lastName: val('ct-last-' + id),
      business: val('ct-business-' + id),
      email: val('ct-email-' + id),
      source: val('ct-source-' + id),
      tags: tags
    });
  });
  refreshContactsHeader();
  syncContactToSite(id);
  autosaveContacts();
}

function deleteContactInline(id) {
  if (!confirm('Delete this contact?')) return;
  state.contacts = (state.contacts || []).filter(function(c) { return c.id !== id; });
  // Clear the link on whichever site pointed at this contact, so it doesn't
  // reference a contact that no longer exists.
  var linkedSite = findLinkedSite(id);
  if (linkedSite) {
    state.sites = state.sites.map(function(s) {
      return s.id === linkedSite.id ? Object.assign({}, s, { contactId: null }) : s;
    });
    autosaveSites();
  }
  editingContactId = null;
  expandedContactId = null;
  toast('Contact deleted', 'success');
  refreshContactsList();
  refreshContactsHeader();
  autosaveContacts();
}

function startAddContact() {
  var id = String(Date.now());
  var c = { id: id, firstName: '', lastName: '', business: '', email: '', source: '', tags: [] };
  state.contacts = state.contacts || [];
  state.contacts.unshift(c);
  editingContactId = id;
  expandedContactId = id;
  refreshContactsList();
  refreshContactsHeader();
}

// One-time best-effort split of a legacy Site "Website Name" into first/last
// — only used here, at import, to bridge old data into the new structured
// Artist First/Last Name fields. Ongoing sync afterwards is exact, no guessing.
function splitNameGuess(fullName) {
  var parts = (fullName || '').trim().split(/\s+/);
  if (parts.length === 0 || !parts[0]) return { first: '', last: '' };
  if (parts.length === 1) return { first: parts[0], last: '' };
  return { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] };
}

function importContactsFromSites() {
  var sites = state.sites || [];
  var unlinked = sites.filter(function(s) { return !s.contactId; });
  if (unlinked.length === 0) {
    toast('All sites are already linked to a contact', 'error');
    return;
  }

  var imported = 0;
  state.sites = sites.map(function(s) {
    if (s.contactId) return s;

    var first = s.artistFirstName || '';
    var last = s.artistLastName || '';
    if (!first && !last && s.name) {
      var guess = splitNameGuess(s.name);
      first = guess.first;
      last = guess.last;
    }

    var contactId = String(Date.now()) + '-' + imported;
    state.contacts.push({
      id: contactId, firstName: first, lastName: last,
      business: '', email: s.email || '', source: '', tags: []
    });
    imported++;

    return Object.assign({}, s, { artistFirstName: first, artistLastName: last, contactId: contactId });
  });

  refreshContactsList();
  refreshContactsHeader();
  autosaveContacts();
  autosaveSites();
  toast('Imported ' + imported + ' contact' + (imported === 1 ? '' : 's') + ' from Sites ✓', 'success');
}

// ── EMAIL INBOX ────────────────────────────────────────────────────────────────
// Talks to the email-inbox / email-send Netlify functions, which hold the
// mailbox password server-side (EMAIL_USER / EMAIL_PASSWORD env vars) —
// never touches this browser. Not preloaded like content/sites/contacts,
// since it's live external data rather than something stored in the repo.
var emailMessages = [];
var emailLoading = false;
var expandedEmailUid = null;
var emailBodyCache = {};
var composingEmail = false;
var replyingToUid = null;

function viewEmailInbox() {
  return '<div class="edit-inner">' +
    '<div class="sticky-hd" style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap">' +
    '<div><div class="edit-title">Inbox</div><div class="edit-sub" id="email-sub">' + (emailLoading ? 'Loading…' : emailMessages.length + ' message' + (emailMessages.length === 1 ? '' : 's')) + '</div></div>' +
    '<div style="display:flex;gap:8px">' +
    '<button class="btn-cancel" onclick="loadEmailInbox()">Refresh</button>' +
    '<button class="btn-cancel" onclick="startComposeEmail()">New Email</button>' +
    '</div></div>' +
    '<div id="email-list">' + renderEmailList() + '</div>' +
    '</div>';
}

async function loadEmailInbox() {
  emailLoading = true;
  var subEl = document.getElementById('email-sub');
  if (subEl) subEl.textContent = 'Loading…';
  try {
    var res = await authFetch('/.netlify/functions/email-inbox');
    var json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed to load inbox');
    emailMessages = json.messages || [];
  } catch (err) {
    toast('Could not load inbox: ' + err.message, 'error');
    emailMessages = [];
  }
  emailLoading = false;
  if (state.currentView === 'email-inbox') {
    var pane = document.getElementById('edit-pane');
    if (pane) pane.innerHTML = viewEmailInbox();
  }
}

function renderEmailList() {
  if (emailLoading) return '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">Loading…</p>';

  var html = '';
  if (composingEmail) html += renderComposeForm();

  if (emailMessages.length === 0) {
    if (!composingEmail) html += '<p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">No messages</p>';
    return html;
  }

  html += emailMessages.map(function(m) {
    var open = expandedEmailUid === m.uid;
    var row = '<div onclick="selectEmail(' + m.uid + ')" style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;' +
      (open ? 'background:var(--ivory);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:4px 4px 0 0' : 'border-bottom:.5px solid var(--border)') + '">' +
      (m.unread ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--pink);flex-shrink:0"></span>' : '<span style="width:7px;flex-shrink:0"></span>') +
      '<div style="flex:1;min-width:0">' +
      '<div style="font-size:13px;color:var(--noir)">' + esc(m.from) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(m.subject) + '</div>' +
      '</div>' +
      '<div style="font-size:10px;color:var(--muted);flex-shrink:0">' + formatEmailDate(m.date) + '</div>' +
      '</div>';
    var panel = open ? renderEmailDetail(m) : '';
    return row + panel;
  }).join('');
  return html;
}

function formatEmailDate(d) {
  if (!d) return '';
  var dt = new Date(d);
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dt.getDate() + ' ' + months[dt.getMonth()];
}

function selectEmail(uid) {
  composingEmail = false;
  if (expandedEmailUid === uid) {
    expandedEmailUid = null;
    replyingToUid = null;
  } else {
    expandedEmailUid = uid;
  }
  refreshEmailList();
}

function refreshEmailList() {
  var container = document.getElementById('email-list');
  if (container) container.innerHTML = renderEmailList();
}

function renderEmailDetail(m) {
  var cached = emailBodyCache[m.uid];
  if (!cached) {
    loadEmailBody(m.uid);
    return '<div onclick="event.stopPropagation()" style="padding:14px 8px;background:var(--ivory);border-radius:0 0 4px 4px;border-bottom:.5px solid var(--border)">' +
      '<p style="font-size:12px;color:var(--muted)">Loading message…</p></div>';
  }
  var bodyText = cached.text || stripHtmlTags(cached.html) || '(empty message)';
  var replyForm = '';
  if (replyingToUid === m.uid) {
    var defaultSubject = (m.subject || '').indexOf('Re:') === 0 ? m.subject : 'Re: ' + m.subject;
    replyForm = '<div style="margin-top:14px;padding-top:14px;border-top:.5px solid var(--border)">' +
      '<div class="field"><label>To</label><input id="reply-to" value="' + esc(cached.from) + '"></div>' +
      '<div class="field"><label>Subject</label><input id="reply-subject" value="' + esc(defaultSubject) + '"></div>' +
      '<div class="field"><label>Message</label><textarea id="reply-body" rows="6"></textarea></div>' +
      '<div class="form-actions"><button class="btn-cancel" onclick="cancelReply()">Cancel</button><button class="btn-save" onclick="sendReply(' + m.uid + ')">Send</button></div>' +
      '</div>';
  }
  return '<div onclick="event.stopPropagation()" style="padding:14px 8px 16px;background:var(--ivory);border-radius:0 0 4px 4px;border-bottom:.5px solid var(--border)">' +
    '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">From ' + esc(cached.from) + (cached.to ? ' · To ' + esc(cached.to) : '') + '</div>' +
    '<div style="font-size:13px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px">' + esc(bodyText) + '</div>' +
    (replyingToUid === m.uid ? replyForm : '<button class="btn-save" onclick="startReplyEmail(' + m.uid + ')">Reply</button>') +
    '</div>';
}

function stripHtmlTags(html) {
  return (html || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
}

async function loadEmailBody(uid) {
  try {
    var res = await authFetch('/.netlify/functions/email-inbox?uid=' + uid);
    var json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Failed to load message');
    emailBodyCache[uid] = json;
  } catch (err) {
    emailBodyCache[uid] = { text: 'Could not load this message: ' + err.message, from: '', to: '', messageId: '' };
  }
  if (expandedEmailUid === uid) refreshEmailList();
}

function startReplyEmail(uid) {
  replyingToUid = uid;
  refreshEmailList();
}

function cancelReply() {
  replyingToUid = null;
  refreshEmailList();
}

async function sendReply(uid) {
  var to = val('reply-to').trim();
  var subject = val('reply-subject').trim();
  var text = val('reply-body').trim();
  if (!to || !text) { toast('To and message are required', 'error'); return; }
  var cached = emailBodyCache[uid] || {};
  try {
    var res = await authFetch('/.netlify/functions/email-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: to, subject: subject, text: text, inReplyTo: cached.messageId, references: cached.messageId })
    });
    var json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Send failed');
    toast('Sent ✓', 'success');
    replyingToUid = null;
    refreshEmailList();
  } catch (err) {
    toast('Send failed: ' + err.message, 'error');
  }
}

function startComposeEmail() {
  composingEmail = true;
  expandedEmailUid = null;
  replyingToUid = null;
  refreshEmailList();
}

function cancelCompose() {
  composingEmail = false;
  refreshEmailList();
}

function renderComposeForm() {
  return '<div onclick="event.stopPropagation()" style="padding:16px 12px 18px;background:var(--ivory);border-radius:6px;margin-bottom:12px">' +
    '<div class="card-title" style="margin-bottom:10px">New Email</div>' +
    '<div class="field"><label>To</label><input id="compose-to" placeholder="name@example.com"></div>' +
    '<div class="field"><label>Subject</label><input id="compose-subject"></div>' +
    '<div class="field"><label>Message</label><textarea id="compose-body" rows="8"></textarea></div>' +
    '<div class="form-actions"><button class="btn-cancel" onclick="cancelCompose()">Cancel</button><button class="btn-save" onclick="sendComposeEmail()">Send</button></div>' +
    '</div>';
}

async function sendComposeEmail() {
  var to = val('compose-to').trim();
  var subject = val('compose-subject').trim();
  var text = val('compose-body').trim();
  if (!to || !text) { toast('To and message are required', 'error'); return; }
  try {
    var res = await authFetch('/.netlify/functions/email-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ to: to, subject: subject, text: text })
    });
    var json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Send failed');
    toast('Sent ✓', 'success');
    composingEmail = false;
    refreshEmailList();
  } catch (err) {
    toast('Send failed: ' + err.message, 'error');
  }
}

// ── PAGES NAV (bespoke + custom, unified, draggable) ──────────────────────────
// The sidebar Pages list is generated from state.content.navPages — an
// ordered list of {id, kind, inMenu}. Bespoke pages (home/story/contact/
// artists/retail) have fixed labels/hrefs; custom pages look themselves up
// from state.content.pages by id. Drag-and-drop reorders this same array,
// which is also what drives the live site's menu via nav.js.
var BESPOKE_PAGES = {
  home:    { label: 'Home',     view: 'home' },
  story:   { label: 'Story',    view: 'story' },
  contact: { label: 'Contact',  view: 'contact' },
  artists: { label: 'Artists',  view: 'artists' },
  retail:  { label: 'Commerce', view: 'retail' }
};

function getNavPages() {
  if (!state.content.navPages) {
    state.content.navPages = [
      { id: 'home', kind: 'home', inMenu: true },
      { id: 'story', kind: 'story', inMenu: true },
      { id: 'contact', kind: 'contact', inMenu: true },
      { id: 'artists', kind: 'artists', inMenu: false },
      { id: 'retail', kind: 'retail', inMenu: false }
    ];
  }
  var navPages = state.content.navPages;
  var pages = state.content.pages || [];

  // Drop entries for custom pages that no longer exist
  navPages = navPages.filter(function(e) {
    if (e.kind !== 'custom') return true;
    return pages.some(function(p) { return p.id === e.id; });
  });
  // Add any custom pages missing from the order (new ones default into the menu)
  pages.forEach(function(p) {
    if (!navPages.some(function(e) { return e.kind === 'custom' && e.id === p.id; })) {
      navPages.push({ id: p.id, kind: 'custom', inMenu: true });
    }
  });

  state.content.navPages = navPages;
  return navPages;
}

function navLabelFor(entry) {
  if (entry.kind === 'custom') {
    var p = findPage(entry.id);
    return (p && p.title) || 'Untitled Page';
  }
  var b = BESPOKE_PAGES[entry.kind];
  return b ? b.label : entry.kind;
}

function navViewFor(entry) {
  if (entry.kind === 'custom') return 'page:' + entry.id;
  var b = BESPOKE_PAGES[entry.kind];
  return b ? b.view : entry.kind;
}

function isInMenu(id, kind) {
  var entry = getNavPages().find(function(e) { return e.kind === kind && e.id === id; });
  return entry ? !!entry.inMenu : false;
}

function setInMenu(id, kind, checked) {
  var entry = getNavPages().find(function(e) { return e.kind === kind && e.id === id; });
  if (entry) entry.inMenu = checked;
  renderPagesNav();
  autosaveContent();
}

function renderPagesNav() {
  var container = document.getElementById('acc-items-pages');
  if (!container) return;
  var navPages = getNavPages();
  var html = navPages.map(function(entry, idx) {
    return '<button class="acc-item" draggable="true" data-idx="' + idx + '" ' +
      'ondragstart="navDragStart(event,' + idx + ')" ' +
      'ondragover="navDragOver(event,' + idx + ')" ' +
      'ondragleave="navDragLeave(event)" ' +
      'ondrop="navDrop(event,' + idx + ')" ' +
      'ondragend="navDragEnd(event)" ' +
      'onclick="showView(\'' + navViewFor(entry) + '\')">' + esc(navLabelFor(entry)) + '</button>';
  }).join('');
  html += '<button class="acc-item" onclick="showView(\'settings-site\')">Site Settings</button>';
  html += '<button class="acc-item" onclick="addCustomPageFromSidebar()">Add Page</button>';
  container.innerHTML = html;
  setActiveNav(state.currentView);
}

var navDragFromIndex = null;

function navDragStart(e, idx) {
  navDragFromIndex = idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function navDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function navDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function navDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.acc-item.drag-over').forEach(function(el) { el.classList.remove('drag-over'); });
}

function navDrop(e, idx) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (navDragFromIndex === null || navDragFromIndex === idx) return;
  var navPages = getNavPages();
  var moved = navPages.splice(navDragFromIndex, 1)[0];
  navPages.splice(idx, 0, moved);
  state.content.navPages = navPages;
  navDragFromIndex = null;
  renderPagesNav();
  autosaveContent();
}

// ── CUSTOM PAGES (data + editor) ──────────────────────────────────────────────
// Generic pages, all rendered by the single page.html template (?slug=xxx) so
// adding one is just a content.json entry — no new files, no repo-write risk.
function findPage(id) {
  return (state.content.pages || []).find(function(p) { return p.id === id; });
}

function viewSingleCustomPage(id) {
  var p = findPage(id);
  if (!p) return '<div class="edit-inner"><p style="color:var(--muted);font-size:13px;text-align:center;margin-top:40px">Page not found</p></div>';
  return '<div class="edit-inner">' +
    '<div class="sticky-hd"><div class="edit-title">' + (esc(p.title) || 'Untitled Page') + '</div><div class="edit-sub">Custom page</div></div>' +
    '<div class="card">' +
    '<div class="field"><label>Title</label><input id="pg-title-' + id + '" oninput="onPageFieldChange(\'' + id + '\')" value="' + esc(p.title) + '"></div>' +
    '<div class="field"><label>Eyebrow (optional)</label><input id="pg-eyebrow-' + id + '" oninput="onPageFieldChange(\'' + id + '\')" value="' + esc(p.eyebrow||'') + '"></div>' +
    '<div class="field"><label>URL Slug</label><input id="pg-slug-' + id + '" oninput="onPageSlugChange(\'' + id + '\')" value="' + esc(p.slug||'') + '">' +
    '<div class="field-hint">Lives at page.html?slug=' + esc(p.slug||'') + '</div></div>' +
    '<div class="field"><label>Image (optional)</label>' +
    (p.image ? '<img src="' + p.image + '" style="max-height:90px;border-radius:4px;margin-bottom:8px;display:block">' : '') +
    '<input type="file" id="pg-image-' + id + '" accept="image/*" onchange="onPageImageChange(\'' + id + '\')" style="padding:6px 0"></div>' +
    '<div class="field"><label>Body</label><textarea id="pg-body-' + id + '" oninput="onPageFieldChange(\'' + id + '\')" rows="8">' + esc(p.body||'') + '</textarea></div>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px;cursor:pointer">' +
    '<input type="checkbox" id="pg-visible-' + id + '" onchange="onPageFieldChange(\'' + id + '\')" style="width:auto"' + (p.visible !== false ? ' checked' : '') + '> Visible on the live site' +
    '</label>' +
    '<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:16px;cursor:pointer">' +
    '<input type="checkbox" id="pg-inmenu-' + id + '" onchange="onPageMenuChange(\'' + id + '\')" style="width:auto"' + (isInMenu(id,'custom') ? ' checked' : '') + '> Show in main menu' +
    '</label>' +
    '<div class="form-actions"><button class="btn-cancel" onclick="deletePageAndGoHome(\'' + id + '\')">Delete Page</button></div>' +
    '</div></div>';
}

function slugify(str) {
  return (str || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '') || 'page';
}

function uniqueSlug(base, excludeId) {
  var pages = state.content.pages || [];
  var slug = base, n = 2;
  while (pages.some(function(p) { return p.slug === slug && p.id !== excludeId; })) {
    slug = base + '-' + n; n++;
  }
  return slug;
}

function onPageFieldChange(id) {
  state.content.pages = (state.content.pages || []).map(function(p) {
    if (p.id !== id) return p;
    return Object.assign({}, p, {
      title: val('pg-title-' + id),
      eyebrow: val('pg-eyebrow-' + id),
      body: val('pg-body-' + id),
      visible: document.getElementById('pg-visible-' + id).checked
    });
  });
  renderPagesNav();
  applyDraftToFrame();
  autosaveContent();
}

function onPageMenuChange(id) {
  var checked = document.getElementById('pg-inmenu-' + id).checked;
  setInMenu(id, 'custom', checked);
}

function onPageSlugChange(id) {
  var slug = uniqueSlug(slugify(val('pg-slug-' + id)), id);
  var input = document.getElementById('pg-slug-' + id);
  if (input && input.value !== slug) input.value = slug;
  state.content.pages = (state.content.pages || []).map(function(p) {
    return p.id === id ? Object.assign({}, p, { slug: slug }) : p;
  });
  setPreview('site', 'page.html?slug=' + encodeURIComponent(slug)); // URL changed — reload to it
  autosaveContent();
}

async function onPageImageChange(id) {
  var newImage;
  try {
    newImage = await readAndResizeImage('pg-image-' + id, 1200, 900, 0.85);
  } catch (err) {
    toast(err.message, 'error');
    return;
  }
  if (!newImage) return;
  state.content.pages = (state.content.pages || []).map(function(p) {
    return p.id === id ? Object.assign({}, p, { image: newImage }) : p;
  });
  applyDraftToFrame();
  autosaveContent();
}

function deletePageAndGoHome(id) {
  if (!confirm('Delete this page?')) return;
  state.content.pages = (state.content.pages || []).filter(function(p) { return p.id !== id; });
  state.content.navPages = (state.content.navPages || []).filter(function(e) { return !(e.kind === 'custom' && e.id === id); });
  toast('Page deleted', 'success');
  autosaveContent();
  showView('home');
}

function addCustomPageFromSidebar() {
  var id = String(Date.now());
  var page = { id: id, title: '', eyebrow: '', body: '', image: null, visible: true, slug: uniqueSlug('page', id) };
  state.content.pages = state.content.pages || [];
  state.content.pages.push(page);
  getNavPages(); // syncs navPages, adds this one with inMenu:true
  renderPagesNav();
  showView('page:' + id);
  autosaveContent();
}


// ── HELPERS ───────────────────────────────────────────────────────────────────
function wireView(view) { /* fields wire via inline oninput/onclick */ }
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.onbeforeunload = function(e) {
  if (state.pendingAutosave) { e.preventDefault(); e.returnValue = ''; return ''; }
};

// ── AUTH ─────────────────────────────────────────────────────────────────────
// Session token stored locally, sent as a Bearer header to every function
// that touches something sensitive (GitHub publish, email). The functions
// themselves verify it server-side — this isn't just a UI gate, a request
// straight to a function URL without a valid token is rejected too.
function getStoredToken() {
  try {
    var raw = localStorage.getItem('bureau_session');
    if (!raw) return null;
    var data = JSON.parse(raw);
    if (!data.token || !data.expires || Date.now() > data.expires) return null;
    return data.token;
  } catch (e) { return null; }
}

function storeToken(token) {
  var expires = parseInt(token.split('.')[0], 10) || (Date.now() + 1000 * 60 * 60 * 24 * 14);
  localStorage.setItem('bureau_session', JSON.stringify({ token: token, expires: expires }));
}

function clearToken() {
  localStorage.removeItem('bureau_session');
}

function authHeaders() {
  var token = getStoredToken();
  return token ? { 'Authorization': 'Bearer ' + token } : {};
}

// Wraps fetch for anything requiring login — adds the token, and bounces
// back to the login screen if the server says the session's no good.
async function authFetch(url, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, authHeaders());
  var res = await fetch(url, options);
  if (res.status === 401) {
    clearToken();
    showLoginScreen('Session expired — please log in again');
    throw new Error('Session expired — please log in again');
  }
  return res;
}

function showLoginScreen(errorMsg) {
  var overlay = document.getElementById('login-overlay');
  if (overlay) overlay.style.display = 'flex';
  var err = document.getElementById('login-error');
  if (err) err.textContent = errorMsg || '';
}

function hideLoginScreen() {
  var overlay = document.getElementById('login-overlay');
  if (overlay) overlay.style.display = 'none';
}

async function attemptLogin() {
  var pw = document.getElementById('login-password').value;
  var btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    var res = await fetch('/.netlify/functions/auth-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    var json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Incorrect password');
    storeToken(json.token);
    hideLoginScreen();
    initBureau();
  } catch (err) {
    showLoginScreen(err.message);
  }
  btn.disabled = false;
}

function logout() {
  clearToken();
  location.reload();
}

function initBureau() {
  renderPagesNav();
  loadAllFromGitHub(true);
}

if (getStoredToken()) {
  hideLoginScreen();
  initBureau();
} else {
  showLoginScreen();
}
</script>
